packages:
  - "apps/*"
  - "packages/*"
# O Babel procura plugins e presets a partir de apps/mobile. Com os links isolados do pnpm, os que vêm
# de dentro de outros pacotes (nativewind, babel-preset-expo) só eram achados pelo NODE_PATH do atalho
# `npx expo`; o EAS Build e o `eas update` chamam o node direto e falhavam. Expor o Babel na raiz resolve.
publicHoistPattern:
  - "@babel/*"
  - "*babel-plugin*"
  - "*babel-preset*"
allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  argon2: true
  cpu-features: false
  protobufjs: false
  ssh2: false
minimumReleaseAgeExclude:
  - "@expo/cli@58.1.21"
  - "@expo/metro-config@58.0.23"
  - "@expo/router-server@58.0.23"
  - babel-preset-expo@58.0.26
  - expo-file-system@58.0.14
  - expo@58.0.26
  - expo-router@58.0.32
  - jest-expo@58.0.15
